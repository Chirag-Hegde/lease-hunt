name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --all-extras
      - name: Lint
        run: |
          uv run ruff check app tests
          uv run ruff format --check app tests
      - name: Type check
        run: uv run mypy app
      - name: Tests
        run: uv run pytest -q --cov=app --cov-report=term

  evals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --all-extras
      - name: Run eval suite (fails if lease F1 regresses > 5 points)
        run: |
          if [ -d ../evals ]; then uv run python -m evals.run --suite all --ci; else echo "evals not yet built"; fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm run test -- --run
      - name: Build
        run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t leaselens-api ./backend
      - name: Build web image
        run: docker build -t leaselens-web ./web
