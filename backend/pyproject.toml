[project]
name = "leaselens-backend"
version = "0.1.0"
description = "LeaseLens API: multi-agent apartment & lease hunter"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "redis>=5.0",
    "arq>=0.26",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0",
    "anthropic>=0.40",
    "openai>=1.50",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "reportlab>=4.2",
    "numpy>=2.0",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
    "tenacity>=9.0",
    "pyyaml>=6.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]

[project.optional-dependencies]
postgres = ["langgraph-checkpoint-postgres>=2.0", "psycopg[binary]>=3.2"]
telemetry = ["langfuse>=2.50"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501", "B008", "SIM108"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["app.services.pdf"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = [
    "fitz.*",
    "pdfplumber.*",
    "reportlab.*",
    "langgraph.*",
    "arq.*",
    "pgvector.*",
    "langfuse.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
